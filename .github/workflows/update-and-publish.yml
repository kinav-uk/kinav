# Every Monday: download the latest CQC data, rebuild the app's care listings and
# republish the website. Every other day: just republish, so the Pinterest product
# feeds release that day's pins. Also republishes whenever app changes are pushed.
name: Update CQC data and publish

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: CQC update, then publish
    - cron: "0 7 * * *"   # Every day 07:00 UTC: publish only (Pinterest feeds)
  workflow_dispatch:       # "Run workflow" button on GitHub
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download CQC data and rebuild listings
        run: python -I update/update_listings.py
      - name: Save the new data
        run: |
          git config user.name "kinav-bot"
          git config user.email "kinav-bot@users.noreply.github.com"
          git add app/data app/care app/guides app/plans app/articles app/care-cost-calculator app/benefits-calculator app/ask-a-specialist app/will-they-have-to-sell-the-house-to-pay-for-care app/letters app/shop app/sitemap.xml app/robots.txt
          if git diff --cached --quiet; then
            echo "No changes in CQC data this week."
          else
            git commit -m "Weekly CQC data update"
            git push
          fi

  publish:
    needs: update
    # Publish after a successful update, or straight away for a code push.
    # If the CQC download fails, the live site keeps last week's data.
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50   # recent history, so IndexNow sends only the pages that changed
      - name: Release today's Pinterest product pins
        run: python3 -I update/shop_feeds.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Tell search engines about the pages (IndexNow)
        continue-on-error: true
        run: python3 update/indexnow.py
